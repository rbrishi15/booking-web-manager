name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Migration numbers are unique
        run: bash scripts/check-migration-numbers.sh

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  session-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # These deliberately unconfigured tests verify error handling, not API health.
      - name: Check missing-configuration behavior and public resources
        run: npm run test:e2e
      - name: Check anonymous authentication pages and form validation
        run: npm run test:e2e:auth
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: session-api-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  session-integration:
    name: Session integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check session persistence and authenticated browser workflows
        run: npm run test:sessions:integration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: session-integration-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  authenticated-session-discovery:
    name: Authenticated session discovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - run: npm ci
      # Uses real migrations and disposable local services; no production credentials.
      - name: Require authenticated discovery and reject anonymous requests
        run: npm run test:e2e:discovery
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: public-session-discovery-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
